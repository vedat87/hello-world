name: MuMaker Mobile APK

on:
  push:
    branches: [ "mumaker-mobile-apk-build" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild source archive
        shell: bash
        run: |
          cat mumaker-mobile-build/xz/xz-*.b64 | base64 -d > MuMakerMobile003_Project.tar.xz
          tar -xJf MuMakerMobile003_Project.tar.xz

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install jTDS driver
        shell: bash
        run: |
          mkdir -p MuMakerMobile/app/libs
          curl -L --fail \
            "https://raw.githubusercontent.com/sgavathe/geoserver-maven/bb1661195db1497597f745eef6d89fc0a82575d9/net/sourceforge/jtds/jtds/1.3.1/jtds-1.3.1.jar" \
            -o MuMakerMobile/app/libs/jtds-1.3.1.jar
          python3 - <<'PY'
          from pathlib import Path
          p = Path('MuMakerMobile/app/build.gradle')
          s = p.read_text()
          s = s.replace("implementation 'net.sourceforge.jtds:jtds:1.3.1'", "implementation files('libs/jtds-1.3.1.jar')")
          p.write_text(s)
          PY
          test -s MuMakerMobile/app/libs/jtds-1.3.1.jar

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Build debug APK
        working-directory: MuMakerMobile
        run: gradle --no-daemon assembleDebug

      - name: Verify APK exists
        shell: bash
        run: test -s MuMakerMobile/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MuMakerMobile003
          path: MuMakerMobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
