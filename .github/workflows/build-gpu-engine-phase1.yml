name: Build Special Main MuGPU x86

on:
  push:
    branches: [ "mu-gpu-engine-phase1" ]
    paths:
      - ".github/workflows/build-gpu-engine-phase1.yml"
      - "mu-gpu-engine-phase1/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate GPU core + SpecialMain v5 hot path
        shell: pwsh
        run: |
          python mu-gpu-engine-phase1/phase3/build_phase3.py
          python mu-gpu-engine-phase1/phase3/fix_phase3_shutdown.py
          Copy-Item mu-gpu-engine-phase1/special/SpecialMainBridge.cpp out/SpecialMainBridge.cpp -Force
          python mu-gpu-engine-phase1/special/patch_v2_lazy_cpu.py
          python mu-gpu-engine-phase1/special/fix_v2_seh.py
          python mu-gpu-engine-phase1/special/patch_v3_bone_texture_compat.py
          python mu-gpu-engine-phase1/special/patch_v4_pot_rgba32f.py
          python mu-gpu-engine-phase1/special/patch_v5_hotpath_cache.py

      - name: Build MuGPU.dll Win32 x86
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSINSTALL=%%i
          echo VSINSTALL=%VSINSTALL%> mugpu-build.txt
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x86 -host_arch=x64
          cl 2>> mugpu-build.txt
          cl /nologo /O2 /MT /EHsc /std:c++17 /DWIN32 /D_WINDOWS /LD out\SpecialMainBridge.cpp out\GpuSkinningLegacy.cpp /Fe:MuGPU.dll /link opengl32.lib user32.lib kernel32.lib /OUT:MuGPU.dll >> mugpu-build.txt 2>&1
          if errorlevel 1 type mugpu-build.txt & exit /b 1

      - name: Collect
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force mugpu-out | Out-Null
          foreach($f in @('MuGPU.dll','MuGPU.lib','mugpu-build.txt','out/GpuSkinningLegacy.h','out/GpuSkinningLegacy.cpp','out/SpecialMainBridge.cpp','out/PHASE3-INDEXED.txt')) {
            if(Test-Path $f) { Copy-Item $f mugpu-out/ -Force }
          }
          if(Test-Path MuGPU.dll) {
            (Get-FileHash MuGPU.dll -Algorithm SHA256).Hash | Set-Content mugpu-out/MuGPU_SHA256.txt
          }
          "Special Main v5 - keeps v4 full-precision POT RGBA32F visuals. Removes per-transform/per-fallback heap vector allocations, caches static mesh/texture eligibility, caches shader uniforms per transform serial, and reduces diagnostic disk logging from every 10k to every 100k GPU draws. Adds transform counter for profiling. No render/blend mode changes." | Set-Content -Encoding UTF8 mugpu-out/V5-NOTES.txt

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MuGPU-SpecialMain-v5-x86
          path: mugpu-out
          retention-days: 30
