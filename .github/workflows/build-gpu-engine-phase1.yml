name: Build MU GPU Engine Phase1 Kit

on:
  push:
    branches: [ "mu-gpu-engine-phase1" ]
    paths:
      - ".github/workflows/build-gpu-engine-phase1.yml"
      - "mu-gpu-engine-phase1/**"
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch upstream GPU skinning implementation
        shell: pwsh
        run: |
          git clone --filter=blob:none https://github.com/sven-n/MuMain.git upstream
          cd upstream
          git fetch origin 0702144c8446cef41e4b28b95576376aae93f2e4 896afef6d572c6069ef628ba45fa2270729d500e f400d90e9fad93733e11a0870fa1722519564352 983d59ed872aa186a199ad6bc54180c318bc7526
          New-Item -ItemType Directory -Force ../out | Out-Null
          git format-patch -1 0702144c8446cef41e4b28b95576376aae93f2e4 --stdout | Set-Content -Encoding UTF8 ../out/0001-GPU-bone-skinning-core.patch
          git format-patch -1 896afef6d572c6069ef628ba45fa2270729d500e --stdout | Set-Content -Encoding UTF8 ../out/0002-BMD-UBO-driver-call-reduction.patch
          git format-patch -1 f400d90e9fad93733e11a0870fa1722519564352 --stdout | Set-Content -Encoding UTF8 ../out/0003-Bone-palette-3x4-affine.patch
          git format-patch -1 983d59ed872aa186a199ad6bc54180c318bc7526 --stdout | Set-Content -Encoding UTF8 ../out/0004-BMD-VAO-dynamic-VBO.patch

      - name: Add migration notes
        shell: pwsh
        run: |
          @'
          MU ONLINE - GPU ENGINE PHASE 1 PORTING KIT
          ==========================================

          Hedef:
          - Main 5.2 / Louis tabaninda CPU vertex skinning yerine GPU skeletal skinning.
          - Orijinal goruntu, texture/blend/chrome/fog davranisini korumak.
          - Kalabalik character/monster sahnelerinde CPU tarafindaki BMD::Transform vertex dongusunu kaldirmak.

          Referans GPU skinning commit'i:
          0702144c8446cef41e4b28b95576376aae93f2e4

          Referans uygulamanin olculmus sonucu:
          BMD::Transform self-time ~0.25 ms -> ~0.01-0.02 ms (15-20x CPU-side skinning reduction).

          Bu KIT dogrudan kullanicinin Main.exe dosyasini DEGISTIRMEZ.
          Bu patch'ler ayni Season 5.2/Louis kaynak soyundan gelen upstream referans degisiklikleridir.
          Kullaniciya ait Source Main 5.2 kaynaklariyla satir/simge eslestirmesi yapilarak port edilmelidir.

          Mimari:
          1) CPU animasyon palette/bone matrix hesaplar.
          2) Rest-pose vertex + bone index VBO'da statik tutulur.
          3) Bone palette UBO ile GPU'ya yuklenir.
          4) Vertex shader position/normal skinning yapar.
          5) Cloth/physics gibi CPU vertex isteyen yollar CPU fallback kullanir.

          Patch sirasi:
          0001 GPU skinning + shader/RHI core
          0002 BMD shader parametrelerini UBO'ya toplama
          0003 bone palette'i 3x4 affine row olarak yukleme
          0004 dinamik VBO attribute formatini VAO icine cache'leme

          Dikkat:
          - 0001 buyuk renderer migration'idir ve cok sayida dosyaya dokunur.
          - Main.exe binary byte patch ile GPU skinning elde edilemez; BMD kaynak akisinin shader pipeline'a tasinmasi gerekir.
          - Cloth/shadow/vertex-wave gibi CPU vertex tuketen yollar icin fallback korunmalidir.
          - Kullanici Main'i custom Louis/V43 oldugu icin patch otomatik uygulanmadan once ZzzBMD.cpp/.h ve proje dosyasi ile eslestirilmelidir.
          '@ | Set-Content -Encoding UTF8 out/PORTING-NOTES.txt

          @'
          GPU_PHASE1=1
          GPU_SKINNING=1
          CPU_VERTEX_SKINNING_FALLBACK=1
          BONE_PALETTE_3X4=1
          BMD_VBO_VAO_CACHE=1
          TARGET_WIN32_X86=1
          TARGET_VS2026=1
          '@ | Set-Content -Encoding ASCII out/GPU-ENGINE-PHASE1.ini

      - name: Create package
        shell: pwsh
        run: |
          Compress-Archive -Path out/* -DestinationPath Main_GPU_Engine_Phase1_PortKit.zip -Force

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Main-GPU-Engine-Phase1-PortKit
          path: Main_GPU_Engine_Phase1_PortKit.zip
          retention-days: 30
