name: Build GPU Legacy Phase3 Indexed x86

on:
  push:
    branches: [ "mu-gpu-engine-phase1" ]
    paths:
      - ".github/workflows/build-gpu-legacy-phase3-indexed.yml"
      - "mu-gpu-engine-phase1/phase3-trigger.txt"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Phase3 source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item mu-gpu-engine-phase1/legacy/* out/ -Force

          # Header: add indexed mesh upload API while keeping Phase1 API for fallback.
          $h = 'out/GpuSkinningLegacy.h'
          $hc = Get-Content $h -Raw
          $needle = '    bool UploadMesh(const void* meshKey, const SkinnedVertex* vertices, std::size_t vertexCount);'
          $insert = $needle + "`r`n    bool UploadIndexedMesh(const void* meshKey, const SkinnedVertex* vertices, std::size_t vertexCount,`r`n                           const std::uint32_t* indices, std::size_t indexCount);"
          if (-not $hc.Contains($needle)) { throw 'UploadMesh declaration not found' }
          $hc = $hc.Replace($needle, $insert)
          Set-Content $h $hc -Encoding ascii

          # Core: element-buffer constants and indexed mesh fields.
          $p = 'out/GpuSkinningLegacy.cpp'
          $c = Get-Content $p -Raw
          $c = $c.Replace('#ifndef GL_STATIC_DRAW', "#ifndef GL_ELEMENT_ARRAY_BUFFER`r`n#define GL_ELEMENT_ARRAY_BUFFER 0x8893`r`n#endif`r`n#ifndef GL_STATIC_DRAW")
          $c = $c.Replace('        GLuint vbo = 0;`r`n        GLsizei vertexCount = 0;', '        GLuint vbo = 0;`r`n        GLuint ibo = 0;`r`n        GLsizei vertexCount = 0;`r`n        GLsizei indexCount = 0;')

          # Phase2: cache bone palette per transform serial.
          $c = $c.Replace('    std::string gError;', "    std::string gError;`r`n    std::uint32_t gLastPaletteSerial = 0;")
          $patternPalette = '(?s)        // Upload one compact 3x4 affine palette\. 200 bones = 9\.6 KB max\..*?        glUseProgram_\(gProgram\);'
          $replacementPalette = @'
        // Phase3 hot path: upload the compact 3x4 palette once per BMD transform serial.
        if (gLastPaletteSerial != s.paletteSerial)
        {
            glActiveTexture_(GL_TEXTURE1);
            glBindTexture(GL_TEXTURE_2D, gBoneTexture);
            const int rows = s.boneCount > 200 ? 200 : s.boneCount;
            glTexSubImage2D(GL_TEXTURE_2D, 0, 0, 0, 3, rows, GL_RGBA, GL_FLOAT, s.boneRows);
            gLastPaletteSerial = s.paletteSerial;
        }

        glUseProgram_(gProgram);
'@
          $new = [regex]::Replace($c, $patternPalette, $replacementPalette)
          if ($new -eq $c) { throw 'palette hot-path patch failed' }
          $c = $new

          # Add indexed uploader immediately before DrawMesh.
          $marker = '    bool DrawMesh(const void* meshKey, const SkinningState& s)'
          if (-not $c.Contains($marker)) { throw 'DrawMesh marker not found' }
          $indexed = @'
    bool UploadIndexedMesh(const void* meshKey, const SkinnedVertex* vertices, std::size_t vertexCount,
                           const std::uint32_t* indices, std::size_t indexCount)
    {
        if (!IsAvailable() || !meshKey || !vertices || vertexCount == 0 || !indices || indexCount == 0) return false;
        auto old = gMeshes.find(meshKey);
        if (old != gMeshes.end()) return true;

        MeshBuffer b;
        glGenBuffers_(1, &b.vbo);
        glBindBuffer_(GL_ARRAY_BUFFER, b.vbo);
        glBufferData_(GL_ARRAY_BUFFER,
                      static_cast<std::ptrdiff_t>(vertexCount * sizeof(SkinnedVertex)),
                      vertices, GL_STATIC_DRAW);

        glGenBuffers_(1, &b.ibo);
        glBindBuffer_(GL_ELEMENT_ARRAY_BUFFER, b.ibo);
        glBufferData_(GL_ELEMENT_ARRAY_BUFFER,
                      static_cast<std::ptrdiff_t>(indexCount * sizeof(std::uint32_t)),
                      indices, GL_STATIC_DRAW);

        glBindBuffer_(GL_ARRAY_BUFFER, 0);
        glBindBuffer_(GL_ELEMENT_ARRAY_BUFFER, 0);
        if (glGetError() != GL_NO_ERROR)
        {
            if (b.ibo) glDeleteBuffers_(1, &b.ibo);
            if (b.vbo) glDeleteBuffers_(1, &b.vbo);
            gError = "Static indexed BMD VBO/IBO upload failed";
            return false;
        }
        b.vertexCount = static_cast<GLsizei>(vertexCount);
        b.indexCount = static_cast<GLsizei>(indexCount);
        gMeshes.emplace(meshKey, b);
        return true;
    }

'@
          $c = $c.Replace($marker, $indexed + $marker)

          # Draw indexed when an IBO exists; retain glDrawArrays for legacy cached meshes.
          $oldDraw = '        glActiveTexture_(GL_TEXTURE0); // Main''s currently bound BMD/chrome texture is unit 0.`r`n        glDrawArrays(GL_TRIANGLES, 0, it->second.vertexCount);'
          $newDraw = @'
        glActiveTexture_(GL_TEXTURE0); // Main's currently bound BMD/chrome texture is unit 0.
        if (it->second.ibo && it->second.indexCount > 0)
        {
            glBindBuffer_(GL_ELEMENT_ARRAY_BUFFER, it->second.ibo);
            glDrawElements(GL_TRIANGLES, it->second.indexCount, GL_UNSIGNED_INT, nullptr);
            glBindBuffer_(GL_ELEMENT_ARRAY_BUFFER, 0);
        }
        else
        {
            glDrawArrays(GL_TRIANGLES, 0, it->second.vertexCount);
        }
'@
          if (-not $c.Contains($oldDraw)) { throw 'legacy draw block not found' }
          $c = $c.Replace($oldDraw, $newDraw)

          # Delete IBOs alongside VBOs.
          $c = $c.Replace('        if (it->second.vbo && glDeleteBuffers_) glDeleteBuffers_(1, &it->second.vbo);', "        if (it->second.ibo && glDeleteBuffers_) glDeleteBuffers_(1, &it->second.ibo);`r`n        if (it->second.vbo && glDeleteBuffers_) glDeleteBuffers_(1, &it->second.vbo);")
          $c = $c.Replace('                if (kv.second.vbo) glDeleteBuffers_(1, &kv.second.vbo);', "                if (kv.second.ibo) glDeleteBuffers_(1, &kv.second.ibo);`r`n                if (kv.second.vbo) glDeleteBuffers_(1, &kv.second.vbo);")

          # Avoid driver sync in every mesh draw; keep validation at resource upload boundaries.
          $c = $c.Replace('        return glGetError() == GL_NO_ERROR;', '        return true;')
          $c = $c.Replace('        gAvailable = false;', "        gLastPaletteSerial = 0;`r`n        gAvailable = false;")
          Set-Content $p $c -Encoding ascii

          # Bridge: deduplicate triangle corners by (position,normal,uv) and upload an index buffer.
          $b = 'out/BMDGpuBridge.cpp'
          $bc = Get-Content $b -Raw
          $bc = $bc.Replace('#include <cstring>', "#include <cstring>`r`n#include <unordered_map>")
          $patternBridge = '(?s)    bool BuildGpuMesh\(Mesh_t\* mesh\)\s*\{.*?        return MuGpuSkin::UploadMesh\(mesh, out\.data\(\), out\.size\(\)\);\s*    \}'
          $replacementBridge = @'
    struct CornerKey
    {
        int vi, ni, ti;
        bool operator==(const CornerKey& o) const { return vi == o.vi && ni == o.ni && ti == o.ti; }
    };
    struct CornerHash
    {
        std::size_t operator()(const CornerKey& k) const
        {
            std::size_t h = static_cast<std::size_t>(k.vi) * 73856093u;
            h ^= static_cast<std::size_t>(k.ni) * 19349663u;
            h ^= static_cast<std::size_t>(k.ti) * 83492791u;
            return h;
        }
    };

    bool BuildGpuMesh(Mesh_t* mesh)
    {
        if (!mesh || mesh->NumTriangles <= 0) return false;
        if (MuGpuSkin::HasMesh(mesh)) return true;

        std::vector<MuGpuSkin::SkinnedVertex> vertices;
        std::vector<std::uint32_t> indices;
        vertices.reserve(static_cast<std::size_t>(mesh->NumVertices));
        indices.reserve(static_cast<std::size_t>(mesh->NumTriangles) * 3u);
        std::unordered_map<CornerKey, std::uint32_t, CornerHash> remap;
        remap.reserve(static_cast<std::size_t>(mesh->NumTriangles) * 2u);

        for (int j = 0; j < mesh->NumTriangles; ++j)
        {
            Triangle_t* triangle = &mesh->Triangles[j];
            for (int k = 0; k < triangle->Polygon; ++k)
            {
                const int vi = triangle->VertexIndex[k];
                const int ni = triangle->NormalIndex[k];
                const int ti = triangle->TexCoordIndex[k];
                if (vi < 0 || vi >= mesh->NumVertices || ni < 0 || ni >= mesh->NumNormals || ti < 0 || ti >= mesh->NumTexCoords)
                    return false;

                CornerKey key{vi, ni, ti};
                auto found = remap.find(key);
                if (found != remap.end())
                {
                    indices.push_back(found->second);
                    continue;
                }

                Vertex_t& v = mesh->Vertices[vi];
                Normal_t& n = mesh->Normals[ni];
                TexCoord_t& uv = mesh->TexCoords[ti];
                MuGpuSkin::SkinnedVertex gv{};
                gv.px = v.Position[0]; gv.py = v.Position[1]; gv.pz = v.Position[2];
                gv.nx = n.Normal[0]; gv.ny = n.Normal[1]; gv.nz = n.Normal[2];
                gv.u = uv.TexCoordU; gv.v = uv.TexCoordV;
                gv.positionBone = static_cast<float>(v.Node);
                gv.normalBone = static_cast<float>(n.Node);
                const std::uint32_t newIndex = static_cast<std::uint32_t>(vertices.size());
                vertices.push_back(gv);
                remap.emplace(key, newIndex);
                indices.push_back(newIndex);
            }
        }
        return MuGpuSkin::UploadIndexedMesh(mesh, vertices.data(), vertices.size(), indices.data(), indices.size());
    }
'@
          $newBridge = [regex]::Replace($bc, $patternBridge, $replacementBridge)
          if ($newBridge -eq $bc) { throw 'BMD indexed bridge patch failed' }
          Set-Content $b $newBridge -Encoding ascii

          @'
          MU GPU ENGINE PHASE3 - INDEXED CHARACTER MESH CACHE
          ==================================================
          - Phase1 static rest-pose VBO cache remains.
          - Phase2 one bone-palette upload per BMD transform remains.
          - Phase3 deduplicates triangle corners by (position, normal, texcoord).
          - Static IBO is created once and rendered with glDrawElements.
          - Vertex shader skinning now benefits from the post-transform vertex cache instead of
            re-running the same corner every time it appears in adjacent triangles.
          - Original Main texture/blend/depth state ownership is unchanged.
          - CPU fallback remains for cloth, collision, wave, shadowmap and unsupported passes.

          RageZone/Elion direction used as architectural reference: high FPS is not an API swap;
          efficient culling, static batching, instancing and GPU animation are the important ideas.
          Phase3 implements the indexed/static GPU-mesh-cache part without changing visual assets.
          '@ | Set-Content out/PHASE3-INDEXED.txt -Encoding utf8

      - name: Compile Phase3 GPU core Win32 x86 VS2026
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSINSTALL=%%i
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x86 -host_arch=x64
          cd out
          cl /nologo /c /O2 /GL /Gy /Gw /MT /EHsc /std:c++17 /DNDEBUG /DWIN32 /D_WINDOWS GpuSkinningLegacy.cpp
          lib /nologo /LTCG /OUT:GpuSkinningLegacy_Phase3_Indexed_x86.lib GpuSkinningLegacy.obj
          dumpbin /headers GpuSkinningLegacy.obj > BUILD-VERIFY-PHASE3.txt
          echo Visual Studio 2026 Win32/x86 Phase3 indexed GPU core compile SUCCESS>> BUILD-VERIFY-PHASE3.txt

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path out/* -DestinationPath Main_GPU_Engine_Phase3_Indexed_x86.zip -Force

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Main-GPU-Engine-Phase3-Indexed-x86
          path: Main_GPU_Engine_Phase3_Indexed_x86.zip
          retention-days: 30
