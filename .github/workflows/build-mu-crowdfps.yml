name: Build MU CrowdFPS Win32

on:
  push:
    branches: [ "mu-crowdfps-v1" ]
    paths:
      - "mu-crowdfps/**"
      - ".github/workflows/build-mu-crowdfps.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build x86 DLL
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSINSTALL=%%i
          echo VSINSTALL=%VSINSTALL%
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x86 -host_arch=x64
          cd mu-crowdfps
          cl /nologo /LD /O2 /GL /MT /EHsc /std:c++17 /DWIN32 /D_WINDOWS MuCrowdFPS.cpp /link /LTCG /OPT:REF /OPT:ICF /OUT:MuDX11.dll opengl32.lib

      - name: Forge v0.9 plugin CRC compatibility
        shell: pwsh
        run: |
          cd mu-crowdfps
          python forge_crc.py MuDX11.dll DBD0E22E | Tee-Object -FilePath BUILD-INFO.txt
          python -c "import zlib; d=open('MuDX11.dll','rb').read(); c=zlib.crc32(d)&0xffffffff; print(f'VERIFY CRC32={c:08X}'); assert c==0xDBD0E22E" | Tee-Object -FilePath BUILD-INFO.txt -Append

      - name: Create test package
        shell: pwsh
        run: |
          cd mu-crowdfps
          @'
          MU CrowdFPS v1 - ORIGINAL MAIN KORUNUR

          Bu paket Main.exe dosyasini DEGISTIRMEZ.
          v0.9 client icindeki MuDX11.dll dosyasini bu paketteki MuDX11.dll ile degistirin.
          main.premium ayni kalabilir: DLL CRC32 DBD0E22E olacak sekilde uretilmistir.

          Amac:
          - Orijinal OpenGL goruntusunu korumak
          - glBegin/glVertex/glEnd cizimlerini CPU tarafinda vertex array + glDrawArrays'a toplamak
          - Kalabalik character/monster/effect sahnelerinde OpenGL fonksiyon cagri yukunu azaltmak
          - glFlush beklemesini kaldirmak

          Test:
          1. Eski MuDX11.dll yedegini alin.
          2. MuDX11.dll ve MuCrowdFPS.ini dosyalarini client kokune kopyalayin.
          3. Oyunu normal sekilde acin.
          4. MuCrowdFPS.log olusmali.
          5. Ayni kalabalik Aida/Blue Golem sahnesinde FPS test edin.

          Geri donus: eski MuDX11.dll dosyasini geri koyun.
          '@ | Set-Content -Encoding ASCII TEST-TALIMATI.txt
          Compress-Archive -Path MuDX11.dll,MuCrowdFPS.ini,BUILD-INFO.txt,TEST-TALIMATI.txt -DestinationPath MuCrowdFPS_v1_OriginalMain.zip -Force

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: MuCrowdFPS-v1-OriginalMain
          path: mu-crowdfps/MuCrowdFPS_v1_OriginalMain.zip
          retention-days: 30
