name: Build MU CrowdFPS Win32

on:
  push:
    branches: [ "mu-crowdfps-v1" ]
    paths:
      - "mu-crowdfps/**"
      - ".github/workflows/build-mu-crowdfps.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build x86 DLL
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSINSTALL=%%i
          echo VSINSTALL=%VSINSTALL%
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x86 -host_arch=x64
          cd mu-crowdfps
          cl /nologo /LD /O2 /GL /MT /EHsc /std:c++17 /DWIN32 /D_WINDOWS MuCrowdFPS.cpp /link /LTCG /OPT:REF /OPT:ICF /OUT:MuDX11.dll opengl32.lib gdi32.lib

      - name: Forge v0.9 plugin CRC compatibility
        shell: pwsh
        run: |
          cd mu-crowdfps
          python forge_crc.py MuDX11.dll DBD0E22E | Tee-Object -FilePath BUILD-INFO.txt
          python -c "import zlib; d=open('MuDX11.dll','rb').read(); c=zlib.crc32(d)&0xffffffff; print(f'VERIFY CRC32={c:08X}'); assert c==0xDBD0E22E" | Tee-Object -FilePath BUILD-INFO.txt -Append

      - name: Create test package
        shell: pwsh
        run: |
          cd mu-crowdfps
          @'
          MU CrowdFPS v3 - DEFERRED MESH BATCHER / ORIGINAL MAIN KORUNUR

          Main.exe DEGISTIRILMEZ.

          v2 log sonucu: her glBegin ortalama ~4 vertex uretiyor ve v2 hic batch yapamiyordu.
          v3 tek tek Begin/End bloklarini ayri draw yapmak yerine state/matrix/texture degisene kadar biriktirir.
          GL_TRIANGLES/GL_QUADS/GL_LINES/GL_POINTS bloklari guvenli sinirlarda birlestirilir.
          Texture, matrix, blend, alpha, depth, fog, client-array state degisikliklerinde batch once flush edilir.
          SwapBuffers oncesinde kalan batch mutlaka cizilir.

          Kurulum:
          1. Eski MuDX11.dll dosyasini yedekleyin.
          2. Bu paketteki MuDX11.dll + MuCrowdFPS.ini dosyalarini client kokune koyun.
          3. Main.exe ve main.premium dosyalarini DEGISTIRMEYIN.
          4. Ayni Aida/Blue Golem kalabalik sahnede test edin.
          5. MuCrowdFPS.log dosyasini gonderin.
          '@ | Set-Content -Encoding ASCII TEST-TALIMATI.txt
          Compress-Archive -Path MuDX11.dll,MuCrowdFPS.ini,BUILD-INFO.txt,TEST-TALIMATI.txt -DestinationPath MuCrowdFPS_v3_DeferredBatch_OriginalMain.zip -Force

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: MuCrowdFPS-v3-DeferredBatch-OriginalMain
          path: mu-crowdfps/MuCrowdFPS_v3_DeferredBatch_OriginalMain.zip
          retention-days: 30
