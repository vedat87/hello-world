name: Build GPU Legacy Phase2 x86

on:
  push:
    branches:
      - mu-gpu-engine-phase1
    paths:
      - "mu-gpu-engine-phase1/phase2-trigger.txt"
      - "mu-gpu-engine-phase1/apply-phase2.ps1"
      - ".github/workflows/build-gpu-legacy-phase2.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare package files
        shell: cmd
        run: |
          if not exist out mkdir out
          copy /Y mu-gpu-engine-phase1\legacy\* out\

      - name: Apply Phase2 hot-path patch
        shell: pwsh
        run: |
          ./mu-gpu-engine-phase1/apply-phase2.ps1 -Path out/GpuSkinningLegacy.cpp
          @"
          MU GPU ENGINE PHASE2 - HOT PATH
          ================================
          * Bone palette upload is cached by SkinningState::paletteSerial.
          * Multiple meshes for one BMD transform reuse the same GPU palette.
          * Release DrawMesh no longer calls glGetError after every mesh draw.
          * Static rest-pose VBO cache remains enabled.
          * CPU fallback remains for cloth/collision/wave/unsupported passes.
          "@ | Set-Content out/PHASE2-HOTPATH.txt -Encoding utf8

      - name: Compile GPU core Win32 x86
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSINSTALL=%%i
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x86 -host_arch=x64
          cd out
          cl /nologo /c /O2 /GL /Gy /Gw /MT /EHsc /std:c++17 /DNDEBUG /DWIN32 /D_WINDOWS GpuSkinningLegacy.cpp
          lib /nologo /LTCG /OUT:GpuSkinningLegacy_Phase2_x86.lib GpuSkinningLegacy.obj
          dumpbin /headers GpuSkinningLegacy.obj > BUILD-VERIFY-PHASE2.txt
          echo Visual Studio 2026 Win32/x86 Phase2 GPU core compile SUCCESS>> BUILD-VERIFY-PHASE2.txt

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path out/* -DestinationPath Main_GPU_Engine_Phase2_Legacy_x86.zip -Force

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Main-GPU-Engine-Phase2-Legacy-x86
          path: Main_GPU_Engine_Phase2_Legacy_x86.zip
          retention-days: 30
