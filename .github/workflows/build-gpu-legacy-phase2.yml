name: Build GPU Legacy Phase2 x86

on:
  push:
    branches: [ "mu-gpu-engine-phase1" ]
    paths:
      - ".github/workflows/build-gpu-legacy-phase2.yml"
      - "mu-gpu-engine-phase1/phase2-trigger.txt"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Phase2 source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item mu-gpu-engine-phase1/legacy/* out/ -Force

          $p = 'out/GpuSkinningLegacy.cpp'
          $c = Get-Content $p -Raw

          # Cache the last uploaded bone palette. One BMD normally draws several meshes
          # with the exact same bone palette; Phase1 uploaded 3xN RGBA32F once per mesh.
          $c = $c.Replace('    std::string gError;', "    std::string gError;`r`n    std::uint32_t gLastPaletteSerial = 0;")

          $pattern = '(?s)        // Upload one compact 3x4 affine palette\. 200 bones = 9\.6 KB max\..*?        glUseProgram_\(gProgram\);'
          $replacement = @'
        // Phase2 hot path: upload bone palette only once per BeginTransform serial.
        // A character body usually has multiple meshes, all sharing the same palette.
        if (gLastPaletteSerial != s.paletteSerial)
        {
            glActiveTexture_(GL_TEXTURE1);
            glBindTexture(GL_TEXTURE_2D, gBoneTexture);
            const int rows = s.boneCount > 200 ? 200 : s.boneCount;
            glTexSubImage2D(GL_TEXTURE_2D, 0, 0, 0, 3, rows, GL_RGBA, GL_FLOAT, s.boneRows);
            gLastPaletteSerial = s.paletteSerial;
        }

        glUseProgram_(gProgram);
'@
          $new = [regex]::Replace($c, $pattern, $replacement)
          if ($new -eq $c) { throw 'Phase2 palette patch did not match source' }
          $c = $new

          # glGetError in every mesh draw may serialize/flush the driver. Keep validation at
          # initialization/upload boundaries; production DrawMesh returns after issuing the draw.
          $c = $c.Replace('        return glGetError() == GL_NO_ERROR;', '        return true;')

          # Reset palette cache on shutdown/context recreation.
          $c = $c.Replace('        gAvailable = false;', "        gLastPaletteSerial = 0;`r`n        gAvailable = false;")

          Set-Content -Path $p -Value $c -Encoding ascii

          @'
          MU GPU ENGINE PHASE2 - HOT PATH CHANGES
          =======================================
          1. Bone palette upload is keyed by SkinningState::paletteSerial.
             Multiple meshes of one character/monster no longer re-upload the same 3xN float palette.
          2. Per-mesh glGetError() was removed from the release draw hot path because it can force
             driver synchronization. Initialization and resource upload checks remain.
          3. Static BMD VBO cache from Phase1 remains enabled.
          4. CPU fallback remains for cloth, collision, wave and unsupported passes.
          5. Original Main texture/blend/depth state ownership is unchanged.

          This is a source/static-library integration package; it is NOT a drop-in client DLL.
          It must be linked into the user's own Source Main 5.2 and called from BMD::Transform/RenderMesh.
          '@ | Set-Content out/PHASE2-HOTPATH.txt -Encoding utf8

      - name: Compile Phase2 GPU core Win32 x86 VS2026
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSINSTALL=%%i
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x86 -host_arch=x64
          cd out
          cl /nologo /c /O2 /GL /Gy /Gw /MT /EHsc /std:c++17 /DNDEBUG /DWIN32 /D_WINDOWS GpuSkinningLegacy.cpp
          lib /nologo /LTCG /OUT:GpuSkinningLegacy_Phase2_x86.lib GpuSkinningLegacy.obj
          dumpbin /headers GpuSkinningLegacy.obj > BUILD-VERIFY-PHASE2.txt
          echo Visual Studio 2026 Win32/x86 Phase2 GPU core compile SUCCESS>> BUILD-VERIFY-PHASE2.txt

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path out/* -DestinationPath Main_GPU_Engine_Phase2_Legacy_x86.zip -Force

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Main-GPU-Engine-Phase2-Legacy-x86
          path: Main_GPU_Engine_Phase2_Legacy_x86.zip
          retention-days: 30
