name: MuVer122 temporary Android platform

on:
  push:
    branches:
      - muver122-toolchain-temp

jobs:
  fetch_platform:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SDK and install Android 34 platform
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 --retry-delay 2 -o sdk.tar.xz https://github.com/HomuHomu833/android-sdk-custom/releases/download/37.0.0/android-sdk-x86_64-linux-gnu.tar.xz
          tar -xf sdk.tar.xz
          yes | ./android-sdk/cmdline-tools/bin/sdkmanager --sdk_root="$PWD/android-sdk" "platforms;android-34" >/dev/null
          tar -C android-sdk -cJf android-platform-34.tar.xz platforms/android-34
          ls -lh android-platform-34.tar.xz
      - name: Upload platform
        uses: actions/upload-artifact@v4
        with:
          name: muver122-android-platform-34
          path: android-platform-34.tar.xz
          compression-level: 0
          retention-days: 1
