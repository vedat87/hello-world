name: MuVer122 temporary Android platform

on:
  push:
    branches:
      - muver122-toolchain-temp

jobs:
  fetch_platform:
    runs-on: ubuntu-latest
    steps:
      - name: Pack Android 34 platform from runner
        shell: bash
        run: |
          set -euxo pipefail
          ls -la "$ANDROID_SDK_ROOT/platforms"
          test -f "$ANDROID_SDK_ROOT/platforms/android-34/android.jar"
          tar -C "$ANDROID_SDK_ROOT" -cJf android-platform-34.tar.xz platforms/android-34
          ls -lh android-platform-34.tar.xz
      - name: Upload platform
        uses: actions/upload-artifact@v4
        with:
          name: muver122-android-platform-34
          path: android-platform-34.tar.xz
          compression-level: 0
          retention-days: 1
